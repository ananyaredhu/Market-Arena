# Local SearXNG for the evidence researcher. Start with `make search-up`, stop with `make search-down`.
# Listens on localhost only (not reachable from other machines).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: market-arena-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
