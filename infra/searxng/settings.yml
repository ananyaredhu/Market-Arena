# Minimal SearXNG settings for local use by the evidence researcher.
# The one setting that matters: the `json` output format must be enabled, or the API answers 403.
use_default_settings: true
general:
  instance_name: "Market Arena search"
  enable_metrics: false
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  # Local development only. Change this if you ever expose the instance.
  secret_key: "market-arena-local-dev-not-a-secret"
  limiter: false
  image_proxy: false
