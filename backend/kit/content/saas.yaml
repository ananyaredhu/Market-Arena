# Experiment Kit content for the SaaS pack (owner: Person B).
# Segment priors for SaaS belong to Person A in packs/saas.yaml; this file holds
# only experiment and copy content.
# Placeholders: {product} {price} {price_low} {price_high} {competitor} {outside}
# All thresholds are PROPOSED test thresholds for the founder to adjust.
pack: saas
currency: "S$"
price_unit: /month
outside_option: a free planner, paper or nothing
kit:
  experiment_library:
    budget:
      title: Two-price landing page ({price} vs {price_low})
      hypothesis: Students who want AI planning will join a paid waitlist for {product} at {price}, not only at {price_low}.
      pass_threshold: waitlist sign-up rate at {price} is at least 8% of 100+ unique visitors and at least 70% of the rate at {price_low}.
      kind: landing
    alpha:
      title: Price-ladder survey with target students
      hypothesis: Target students rate {price} a month as acceptable for an AI study planner.
      pass_threshold: at least 40% of 50+ respondents in the target segment place {price} at or below their "getting expensive" price.
      kind: survey
    brand:
      title: Switching interviews with {competitor} users
      hypothesis: Current {competitor} users have a planning pain strong enough to switch.
      pass_threshold: at least 3 of 5 interviewed {competitor} users describe a recent planning failure unprompted.
      kind: interview
    competitor:
      title: Free-tier landing variant against {competitor}
      hypothesis: A free tier with a paid AI upgrade keeps {product} attractive when {competitor} reacts with a price cut, a new feature or a promotion.
      pass_threshold: free-tier sign-ups are at least 15% of 100+ visitors and at least 10% of them try the paid upgrade page.
      kind: landing
    defaults:
      - title: Telegram study-group promo
        hypothesis: Members of opted-in study groups will request an early-access link for {product}.
        pass_threshold: at least 10% of opted-in subscribers tap "Get early access" within 7 days.
        kind: telegram
      - title: Five-student problem interview
        hypothesis: Students who miss deadlines name planning, not motivation, as the main cause.
        pass_threshold: at least 3 of 5 interviewees name a planning failure in the last month.
        kind: interview
      - title: Feature-trade-off survey
        hypothesis: AI exam planning is the feature students value most among the four core attributes.
        pass_threshold: AI planning ranks first for at least 35% of 50+ respondents.
        kind: survey

  hypotheses:
    - key: budget
      text: "Students will pay {price} for {product}. Proposed test threshold: at least 8% of 100+ landing-page visitors join the waitlist at {price}."
    - key: alpha
      text: "{price} sits below the 'getting expensive' point for target students. Proposed test threshold: at least 40% of 50+ survey respondents agree."
    - key: brand
      text: "{competitor} users will switch for better AI planning. Proposed test threshold: at least 3 of 5 interviewed users describe a recent planning failure."
    - key: competitor
      text: "A free tier protects demand against a rival price cut. Proposed test threshold: at least 15% of visitors sign up for the free tier."
    - key: default
      text: "Opted-in study groups respond to an early-access offer. Proposed test threshold: at least 10% of subscribers tap 'Get early access' within 7 days."

  landing:
    headline: "{product}: an exam plan that rewrites itself when your week changes"
    subhead: Tell it your modules and deadlines. It builds the plan and adjusts it every evening.
    benefits:
      - Builds a revision plan from your module deadlines in two minutes.
      - Re-plans automatically when you miss a session, no guilt spiral.
      - Your notes stay private; nothing is shared with your school.
      - Syncs with the calendar you already use.
    price_positioning:
      - "Variant A: {price}/month, cancel any time."
      - "Variant B: {price_low}/month for students who join the waitlist this month."
      - "Variant C: free planner, {price}/month for AI re-planning."

  survey:
    - Which year and course are you in?
    - How do you plan your revision today?
    - In the last month, how many deadlines or study sessions did you miss?
    - What was the main reason for the last one you missed?
    - Rank these - AI planning, simplicity, privacy, calendar integrations.
    - Do you pay for any study or productivity app today? Which, and how much?
    - "At what monthly price would {product} feel cheap? (price ladder)"
    - At what monthly price would it start to feel expensive?
    - At what monthly price would it be too expensive to consider?
    - What would stop you from switching from {competitor}?
    - Would you join a waitlist for early access? (yes / no / maybe)

  interview_script:
    - "Screen: full-time student with at least one exam this term; not on the founding team or a close friend."
    - Tell me about the last time a deadline crept up on you. What happened?
    - How did you plan that week? Show me the tool or notes if you can.
    - What did you try to fix it afterwards? What did that cost you?
    - Which apps do you pay for today, and what made them worth it?
    - "If a tool re-planned your week every evening, what would you expect to pay? (do not suggest a number)"
    - What would make you stop using {competitor} tomorrow?
    - "Close: may we invite you to test {product}? (record consent)"
    - "Notes template: quote, current tool, pain severity 1-5, price mentioned, switching trigger, follow-up consent."

  ad_variants:
    - key: budget
      text: "An exam plan that fixes itself, for {price} a month. Join the {product} waitlist."
    - key: alpha
      text: "Missed a study session? {product} re-plans your week tonight. Early-access price {price_low}."
    - key: brand
      text: "Still dragging tasks around in {competitor}? {product} plans your revision for you."
    - key: competitor
      text: "{product} is free to plan. Upgrade to AI re-planning only when exams hit."
    - key: default
      text: "Your modules in, your revision plan out. Try {product} before finals."

  offline:
    flyer: |
      {product} - YOUR EXAM PLAN, DONE TONIGHT
      Scan to join the early-access waitlist and get the student price.
      [QR CODE: landing page with ?src=campus_poster]
      Private by default. Unsubscribe any time.
    checklist:
      - "Campus booth: book a 2-hour slot outside the library during the week before exams."
      - Bring a laptop running the demo and a printed price-ladder card.
      - Use a unique QR code per poster location so sign-ups can be traced.
      - Record every conversation in the interview notes template.
      - Ask for contact consent only after the demo.

  telegram_variants:
    - "Exams are coming. {product} builds your revision plan and fixes it when your week slips. {price}/month - tap Get early access. Reply /stop to unsubscribe."
    - "Plan for free, upgrade to AI re-planning for {price_low}/month this month only. Tap Interested to hold a spot. Reply /stop to unsubscribe."

  tracking_plan:
    metrics:
      - Unique landing-page visitors per price variant
      - Waitlist sign-ups per variant and the sign-up rate
      - Survey price-ladder answers by segment
      - Interview pain severity and switching triggers
      - Telegram Get early access taps, Interested taps, unsubscribes
    decision_rule: >
      Keep {price} if the landing test and the price-ladder survey both meet
      their proposed thresholds. If only {price_low} passes, test a free tier
      plus paid AI upgrade next. If neither passes, revisit the target segment
      before changing the product.
