<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market Arena — CouncilPanel fixture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
.ma-council {
  --ma-ink: #1c1917;
  --ma-muted: #78716c;
  --ma-line: #e7e5e4;
  --ma-bg: #fafaf9;
  --ma-card: #ffffff;
  --ma-accent: #0f766e;
  --ma-ok: #15803d;
  --ma-warn: #b45309;
  --ma-bad: #b91c1c;
  color: var(--ma-ink);
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  line-height: 1.5;
  max-width: 920px;
}
.ma-verdict-card {
  background: var(--ma-card);
  border: 1px solid var(--ma-line);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.25rem;
}
.ma-verdict-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.ma-verdict-top h2 {
  margin: 0;
  font-size: 1.25rem;
}
.ma-pill {
  color: #fff;
  border-radius: 999px;
  padding: 0.2rem 0.7rem;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ma-verdict {
  font-size: 1.05rem;
  margin: 0.85rem 0;
}
.ma-fragility-bar {
  height: 8px;
  background: var(--ma-line);
  border-radius: 999px;
  overflow: hidden;
}
.ma-fragility-bar > div {
  height: 100%;
  background: var(--ma-accent);
}
.ma-muted {
  color: var(--ma-muted);
  font-size: 0.9rem;
}
.ma-error {
  color: var(--ma-bad);
}
.ma-warn-banner {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  padding: 0.5rem 0.75rem;
  border-radius: 8px;
  font-size: 0.9rem;
}
.ma-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.75rem;
}
.ma-btn,
.ma-btn-link {
  border: 1px solid var(--ma-line);
  background: var(--ma-bg);
  color: var(--ma-ink);
  border-radius: 8px;
  padding: 0.35rem 0.75rem;
  font: inherit;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.ma-btn:hover,
.ma-btn-link:hover {
  border-color: var(--ma-accent);
}
.ma-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.25rem;
}
@media (max-width: 700px) {
  .ma-grid {
    grid-template-columns: 1fr;
  }
}
.ma-risks,
.ma-experiments {
  padding-left: 1.2rem;
}
.ma-metric {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.9rem;
}
.ma-kind {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ma-accent);
  border: 1px solid var(--ma-line);
  border-radius: 999px;
  padding: 0.1rem 0.5rem;
}
.ma-exp-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.ma-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin: 0.75rem 0;
}
.ma-tab {
  border: 1px solid var(--ma-line);
  background: transparent;
  border-radius: 999px;
  padding: 0.3rem 0.75rem;
  cursor: pointer;
  font: inherit;
}
.ma-tab-active {
  background: var(--ma-accent);
  color: #fff;
  border-color: var(--ma-accent);
}
.ma-pre {
  white-space: pre-wrap;
  background: var(--ma-bg);
  border: 1px solid var(--ma-line);
  border-radius: 8px;
  padding: 0.75rem;
  font-size: 0.9rem;
}
.ma-limitations {
  margin-top: 1.25rem;
  color: var(--ma-muted);
}

body { margin: 0; background: #f5f5f4; }
main { padding: 1.5rem; }
.toolbar { display:flex; gap:.5rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
#status { color:#78716c; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <div class="toolbar">
    <strong>Council fixture page (standalone)</strong>
    <button type="button" class="ma-btn" id="btn-saas">SaaS</button>
    <button type="button" class="ma-btn" id="btn-cafe">Café</button>
    <button type="button" class="ma-btn" id="btn-copy-md">Copy Markdown export</button>
    <button type="button" class="ma-btn" id="btn-download">Download .md</button>
    <span id="status"></span>
  </div>
  <div id="root"></div>
</main>
<script>
const DATA = {"saas": {"council": {"run_id": "run_saas_fixture", "verdict": "Simulated outcome under stated assumptions: StudyFlow takes a median share of 0.18 (p10 0.16, p90 0.20). Biggest threat: Free Planner responds with adding a feature (share 0.177 -> 0.135 (-0.042, -23.8%)). Fragility 0.12, confidence low.", "confidence": "low", "fragility": 0.125, "who_buys": ["Power planners: 35 of 90 simulated agents chose StudyFlow (0.39)"], "who_rejects": ["Budget-conscious students: 22 of 120 simulated agents chose StudyFlow (0.18); most chose Free Planner; 40 had StudyFlow as runner-up (mean utility gap 0.27)", "Free-tool loyalists: 0 of 90 simulated agents chose StudyFlow (0.00); most chose Free Planner"], "risks": [{"title": "Free Planner responds with adding a feature", "evidence": "Competitor Strategist: the rival's best one-step response among the bounded moves.", "metric": "share 0.177 -> 0.135 (-0.042, -23.8%)"}, {"title": "Willingness to pay is lower than assumed", "evidence": "Devil's Advocate: if willingness to pay (budget) is 20% lower than assumed, the simulated share changes as shown.", "metric": "share 0.177 -> 0.146 (-0.032, -17.9%)"}, {"title": "Customers are more price-sensitive than assumed", "evidence": "Devil's Advocate: if price sensitivity is 20% higher than assumed, the simulated share changes as shown.", "metric": "share 0.177 -> 0.162 (-0.015, -8.5%)"}], "competitor_reaction": {"competitor_id": "free_tool", "move": "add_feature", "effect_on_share": -0.0423}, "experiments": [{"title": "Free-tier landing variant against Free Planner", "hypothesis": "A free tier with a paid AI upgrade keeps StudyFlow attractive when Free Planner reacts with a price cut, a new feature or a promotion.", "pass_threshold": "Proposed test threshold (not an established benchmark): free-tier sign-ups are at least 15% of 100+ visitors and at least 10% of them try the paid upgrade page.", "kind": "landing"}, {"title": "Two-price landing page (S$9 vs S$7.20)", "hypothesis": "Students who want AI planning will join a paid waitlist for StudyFlow at S$9, not only at S$7.20.", "pass_threshold": "Proposed test threshold (not an established benchmark): waitlist sign-up rate at S$9 is at least 8% of 100+ unique visitors and at least 70% of the rate at S$7.20.", "kind": "landing"}, {"title": "Price-ladder survey with target students", "hypothesis": "Target students rate S$9 a month as acceptable for an AI study planner.", "pass_threshold": "Proposed test threshold (not an established benchmark): at least 40% of 50+ respondents in the target segment place S$9 at or below their \"getting expensive\" price.", "kind": "survey"}], "limitations": ["Confidence capped at low: results come from the mock engine adapter, not the real engine.", "Simulated outcome under stated assumptions; not a forecast of real sales."], "engine_source": "mock"}, "kit": {"hypotheses": ["A free tier protects demand against a rival price cut. Proposed test threshold: at least 15% of visitors sign up for the free tier.", "Students will pay S$9 for StudyFlow. Proposed test threshold: at least 8% of 100+ landing-page visitors join the waitlist at S$9.", "S$9 sits below the 'getting expensive' point for target students. Proposed test threshold: at least 40% of 50+ survey respondents agree.", "Free Planner users will switch for better AI planning. Proposed test threshold: at least 3 of 5 interviewed users describe a recent planning failure.", "Opted-in study groups respond to an early-access offer. Proposed test threshold: at least 10% of subscribers tap 'Get early access' within 7 days."], "assets": {"landing_copy": "# StudyFlow: an exam plan that rewrites itself when your week changes\n\nTell it your modules and deadlines. It builds the plan and adjusts it every evening.\n\n## Why switch\n- Builds a revision plan from your module deadlines in two minutes.\n- Re-plans automatically when you miss a session, no guilt spiral.\n- Your notes stay private; nothing is shared with you d in Free Planner? StudyFlow plans your revision for you.", "Your modules in, your revision plan out. Try StudyFlow before finals."], "offline": {"flyer": "StudyFlow - YOUR EXAM PLAN, DONE TONIGHT\nScan to join the early-access waitlist and get the student price.\n[QR CODE: landing page with ?src=campus_poster]\nPrivate by default. Unsubscribe any time.", "checklist": ["Campus booth: book a 2-hour slot outside the library during the week before exams.", "Bring a laptop running the demo and a printed price-ladder card.", "Use a unique QR code per poster location so sign-ups can be traced.", "Record every conversation in the interview notes template.", "Ask for contact consent only after the demo."], "price_board_test": []}, "telegram_variants": ["Exams are coming. StudyFlow builds your revision plan and fixes it when your week slips. S$9/month - tap Get early access. Reply /stop to unsubscribe.", "Plan for free, upgrade to AI re-planning for S$7.20/month this month only. Tap Interested to hold a spot. Reply /stop to unsubscribe."], "tracking_plan": {"metrics": ["Unique landing-page visitors per price variant", "Waitlist sign-ups per variant and the sign-up rate", "Survey price-ladder answers by segment", "Interview pain severity and switching triggers", "Telegram Get early access taps, Interested taps, unsubscribes"], "decision_rule": "Keep S$9 if the landing test and the price-ladder survey both meet their proposed thresholds. If only S$7.20 passes, test a free tier plus paid AI upgrade next. If neither passes, revisit the target segment before changing the product."}}}}, "cafe": {"council": {"run_id": "run_cafe_fixture", "verdict": "Simulated outcome under stated assumptions: Corner Brew takes a median share of 0.12 (p10 0.11, p90 0.15). Biggest threat: Chain caf\u00e9 responds with a 20% price cut (share 0.122 -> 0.101 (-0.020, -16.8%)). Fragility 0.09, confidence low.", "confidence": "low", "fragility": 0.0867, "who_buys": ["Remote workers: 28 of 60 simulated agents chose Corner Brew (0.47)"], "who_rejects": ["Office lunch crowd: 8 of 90 simulated agents chose Corner Brew (0.09); most chose Hawker kopi stall", "Students on a budget: 5 of 90 simulated agents chose Corner Brew (0.06); most chose Hawker kopi stall", "Hawker loyalists: 0 of 60 simulated agents chose Corner Brew (0.00); most chose Hawker kopi stall"], "risks": [{"title": "Chain caf\u00e9 responds with a 20% price cut", "evidence": "Competitor Strategist: the rival's best one-step response among the bounded moves.", "metric": "share 0.122 -> 0.101 (-0.020, -16.8%)"}, {"title": "Customers are more price-sensitive than assumed", "evidence": "Devil's Advocate: if price sensitivity is 20% higher than assumed, the simulated share changes as shown.", "metric": "share 0.122 -> 0.108 (-0.013, -10.9%)"}, {"title": "Willingness to pay is lower than assumed", "evidence": "Devil's Advocate: if willingness to pay (budget) is 20% lower than assumed, the simulated share changes as shown.", "metric": "share 0.122 -> 0.109 (-0.013, -10.7%)"}], "competitor_reaction": {"competitor_id": "chain_cafe", "move": "price_cut_20", "effect_on_share": -0.0204}, "experiments": [{"title": "Loyalty-card retention check against Chain caf\u00e9", "hypothesis": "A stamp card keeps repeat visits steady even if Chain caf\u00e9 reacts with a price cut, a new menu item or a promotion.", "pass_threshold": "Proposed test threshold (not an established benchmark): at least 30% of first-time stamp-card holders return within 14 days.", "kind": "offline"}, {"title": "Tasting event with a price-ladder card", "hypothesis": "After tasting, students and office workers state they would pay S$4.80 rather than switch back to a cheaper option.", "pass_threshold": "Proposed test threshold (not an established benchmark): at least 40% of 30+ tasters pick S$4.80 or higher on the price-ladder card.", "kind": "offline"}, {"title": "Price-board test at S$4.80 vs S$3.84", "hypothesis": "Enough walk-past customers buy Corner Brew at S$4.80 that the lower S$3.84 price is not needed.", "pass_threshold": "Proposed test threshold (not an established benchmark): over two comparable weekday lunch hours, purchases at S$4.80 reach at least 70% of purchases at S$3.84.", "kind": "offline"}], "limitations": ["Confidence capped at low: results come from the mock engine adapter, not the real engine.", "Simulated outcome under stated assumptions; not a forecast of real sales."], "engine_source": "mock"}, "kit": {"hypotheses": ["Repeat visits survive a rival's price cut or promotion. Proposed test threshold: at least 30% of stamp-card holders return within 14 days.", "Tasting changes price tolerance. Proposed test threshold: at least 40% of tasters choose S$4.80 or higher on the price-ladder card.", "Customers accept S$4.80 for Corner Brew. Proposed test threshold: purchases at S$4.80 reach at least 70% of purchases at S$3.84 on the price board.", "Chain caf\u00e9 regulars will try a new caf\u00e9 with a first-visit offer. Proposed test threshold: at least 5% of 200 flyers are redeemed within 7 days.", "Pre-ordering removes the queue barrier for lunch. Proposed test threshold: at least 15% of Telegram subscribers pre-order within a week."], "assets": {"landing_copy": "# Corner Brew: proper coffee, without the queue\n\nFreshly brewed kopi and specialty coffee, ready when you arrive.\n\n## Why switch\n- Pre-order on Telegram and skip the lunchtime queue.\n- Seats and plugs for a quiet hour of work.\n- Oat milk and less-sugar options as standard.\n- Stamp card from the first cup.\n\n## Price positioning to test (proposed variants)\n- Variant A: every cup S$4.80, stamp card included.\n- Variant B: S$3.84 before 10 am, S$4.80 after.", "survey": ["Where do you usually buy coffee on a weekday?", "How many times a week do you buy coffee or tea outside home?", "What do you usually pay per cup?", "At what price would a cup from Corner Brew be too expensive to consider? (price ladder)", "At what price would it be so cheap you would doubt the quality?", "Rank these for your weekday coffee - taste, speed, distance, seating, price, loyalty rewards.", "How long are you willing to wait at the counter?", "Would you pre-order through Telegram if it meant no queue?", "Do you need oat milk, less sugar or other dietary options?", "What would make you try a new caf\u00e9 instead of Chain caf\u00e9?"], "interview_script": ["Screen: buys coffee or tea outside home at least 3 times a week; not a friend of the founders.", "Walk me through the last time you bought coffee. Where, when, and why there?", "What did you pay, and how did you feel about the price?", "When did you last try a new coffee place? What made you try it?", "What would make you stop going to your usual spot?", "If a caf\u00e9 2 minutes away let you pre-order, what would you expect to pay? (do not suggest a number)", "Close: may we message you when we run a tasting day? (record consent)", "Notes template: quote, current spot, price paid, switching trigger, follow-up consent."], "ad_variants": ["First tasting is free. Try Corner Brew and tell us what it is worth.", "Coffee at S$4.80, no queue. Pre-order from Corner Brew on Telegram.", "Bring this flyer for your first Corner Brew cup. Two minutes from Chain caf\u00e9.", "Quiet seats, good coffee, plugs. Corner Brew is open from 7 am."], "offline": {"flyer": "Corner Brew - FIRST CUP OFFER\nScan the QR code to join our Telegram and claim your first-visit price.\n[QR CODE: t.me/<bot>?start=<campaign_id>]\nPre-order, skip the queue. Reply /stop any time to unsubscribe.", "checklist": ["Tasting event: book a 2-hour slot at a busy time; set the cup target before you start.", "Prepare 30+ tasting cups and a printed price-ladder card for every taster.", "Print 200 QR flyers with a campaign code unique to this event.", "Assign one person to record every taster's price choice and comment.", "Ask for Telegram opt-in only after the tasting, never before.", "Photograph the setup and count leftover flyers at the end."], "price_board_test": ["Week 1, Mon-Wed lunch: board shows S$4.80. Record cups sold per hour.", "Week 1, Thu-Fri lunch: board shows S$3.84. Record cups sold per hour.", "Keep the menu, staff and opening hours identical across both periods.", "Log weather and nearby events; repeat the test if either differs strongly.", "Decision: compare cups per hour and revenue per hour against the proposed threshold."]}, "telegram_variants": ["Hi from Corner Brew! Lunch coffee is S$4.80 today. Tap Pre-order and skip the queue. Reply /stop to unsubscribe.", "Hi from Corner Brew! Before 10 am every cup is S$3.84. Tap Interested to hold one for you. Reply /stop to unsubscribe."], "tracking_plan": {"metrics": ["Cups sold per hour at each board price", "Flyer redemptions by campaign code", "Telegram subscribers, Pre-order taps, Too expensive taps, unsubscribes", "Tasting price-ladder choices", "14-day return rate of stamp-card holders"], "decision_rule": "Keep S$4.80 only if the price-board and tasting tests both meet their proposed thresholds. If either misses, rerun the simulation with lower budget priors and test S$3.84 next."}}}}};
let pack = "saas";

function fragilityLabel(score) {
  if (score < 0.25) return "Relatively robust to the tested ±20% prior shifts.";
  if (score < 0.5) return "Moderately sensitive to the tested prior shifts.";
  return "Fragile under the tested prior shifts — treat as a prompt for real experiments.";
}
function confidenceTone(level) {
  return level === "high" ? "#15803d" : level === "medium" ? "#b45309" : "#b91c1c";
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const a = document.createElement("textarea");
    a.value = text; document.body.appendChild(a); a.select();
    const ok = document.execCommand("copy"); document.body.removeChild(a); return ok;
  }
}
function buildMarkdown(council, kit) {
  const lines = [
    `# Council verdict (${council.run_id})`, "", council.verdict, "",
    `Confidence: **${council.confidence}** · Fragility: **${council.fragility.toFixed(2)}**`,
    "", "## Risks", ...council.risks.map(r => `- **${r.title}** — ${r.metric}`),
    "", "## Experiments",
    ...council.experiments.map(e => `- **${e.title}** (${e.kind}): ${e.hypothesis} — ${e.pass_threshold}`),
  ];
  if (kit) {
    lines.push("", "## Hypotheses", ...kit.hypotheses.map(h => `- ${h}`));
    lines.push("", "## Landing copy", "", kit.assets.landing_copy);
    lines.push("", "## Survey", ...kit.assets.survey.map((q,i) => `${i+1}. ${q}`));
    lines.push("", "## Interview", ...kit.assets.interview_script.map(q => `- ${q}`));
    lines.push("", "## Ads", ...kit.assets.ad_variants.map(a => `- ${a}`));
    lines.push("", "## Flyer", "", kit.assets.offline.flyer);
    lines.push("", "## Telegram", ...kit.assets.telegram_variants.map(t => `- ${t}`));
  }
  return lines.join("\n");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function list(items) {
  return items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : `<p class="ma-muted">None</p>`;
}
function render() {
  const { council, kit } = DATA[pack];
  const reaction = council.competitor_reaction;
  const root = document.getElementById("root");
  root.innerHTML = `
  <section class="ma-council" data-testid="council-panel">
    <header class="ma-verdict-card">
      <div class="ma-verdict-top">
        <h2>Council verdict</h2>
        <span class="ma-pill" style="background:${confidenceTone(council.confidence)}">${esc(council.confidence)} confidence</span>
      </div>
      <p class="ma-verdict">${esc(council.verdict)}</p>
      <div class="ma-fragility">
        <div class="ma-fragility-bar"><div style="width:${Math.round(council.fragility*100)}%"></div></div>
        <p>Fragility <strong>${council.fragility.toFixed(2)}</strong> — ${fragilityLabel(council.fragility)}</p>
        <p class="ma-muted">Fragility measures sensitivity of the <em>simulation</em> to ±20% prior shifts. It is not a sales forecast.</p>
      </div>
      ${council.engine_source === "mock" ? `<p class="ma-warn-banner">Engine source: mock adapter. Numbers are labelled mock results.</p>` : ""}
      <div class="ma-actions">
        <button type="button" class="ma-btn" id="copy-verdict">Copy verdict</button>
      </div>
    </header>
    <div class="ma-grid">
      <div><h3>Who buys</h3>${list(council.who_buys)}</div>
      <div><h3>Who rejects</h3>${list(council.who_rejects)}</div>
    </div>
    <section>
      <h3>Top risks</h3>
      <ol class="ma-risks">${council.risks.map(r => `<li><strong>${esc(r.title)}</strong><div class="ma-metric">${esc(r.metric)}</div><p class="ma-muted">${esc(r.evidence)}</p></li>`).join("")}</ol>
      ${reaction ? `<p class="ma-reaction">Likely competitor reaction: <code>${esc(reaction.competitor_id)}</code> → <code>${esc(reaction.move)}</code> (effect ${reaction.effect_on_share})</p>` : ""}
    </section>
    <section>
      <h3>Recommended experiments</h3>
      <ul class="ma-experiments">${council.experiments.map(e => `<li><div class="ma-exp-head"><strong>${esc(e.title)}</strong><span class="ma-kind">${esc(e.kind)}</span></div><p>${esc(e.hypothesis)}</p><p class="ma-muted">${esc(e.pass_threshold)}</p></li>`).join("")}</ul>
    </section>
    <section>
      <h3>Experiment Kit</h3>
      <h4>Hypotheses</h4>${list(kit.hypotheses)}
      <div class="ma-tabs" id="tabs">
        ${["landing","survey","interview","ads","offline","telegram","tracking"].map(t => `<button type="button" class="ma-tab" data-tab="${t}">${t}</button>`).join("")}
      </div>
      <div class="ma-tab-panel" id="tab-panel"></div>
    </section>
  </section>`;
  document.getElementById("copy-verdict").onclick = async () => {
    const ok = await copyText(council.verdict);
    document.getElementById("status").textContent = ok ? "Verdict copied." : "Copy failed.";
  };
  const tabs = root.querySelectorAll("[data-tab]");
  const show = (name) => {
    tabs.forEach(b => b.classList.toggle("ma-tab-active", b.dataset.tab === name));
    const a = kit.assets;
    let html = "";
    if (name === "landing") html = `<button class="ma-btn" id="copy-tab">Copy</button><pre class="ma-pre">${esc(a.landing_copy)}</pre>`;
    if (name === "survey") html = `<ol>${a.survey.map(q => `<li>${esc(q)}</li>`).join("")}</ol>`;
    if (name === "interview") html = `<ol>${a.interview_script.map(q => `<li>${esc(q)}</li>`).join("")}</ol>`;
    if (name === "ads") html = list(a.ad_variants);
    if (name === "offline") html = `<pre class="ma-pre">${esc(a.offline.flyer)}</pre><h4>Checklist</h4>${list(a.offline.checklist)}${a.offline.price_board_test?.length ? `<h4>Price-board</h4>${list(a.offline.price_board_test)}` : ""}`;
    if (name === "telegram") html = list(a.telegram_variants);
    if (name === "tracking" && a.tracking_plan) html = `${list(a.tracking_plan.metrics)}<p>${esc(a.tracking_plan.decision_rule)}</p>`;
    document.getElementById("tab-panel").innerHTML = html;
    const copyBtn = document.getElementById("copy-tab");
    if (copyBtn) copyBtn.onclick = async () => {
      const ok = await copyText(a.landing_copy);
      document.getElementById("status").textContent = ok ? "Landing copy copied." : "Copy failed.";
    };
  };
  tabs.forEach(b => b.onclick = () => show(b.dataset.tab));
  show("landing");
  window.__councilMarkdown = () => buildMarkdown(council, kit);
  // Self-check for automated smoke without a browser automation stack.
  window.__councilSmoke = () => {
    const panel = document.querySelector("[data-testid=council-panel]");
    const checks = {
      panel: !!panel,
      verdict: !!council.verdict,
      risks: council.risks.length > 0,
      experiments: council.experiments.length > 0,
      kitHypotheses: kit.hypotheses.length >= 3,
      markdown: buildMarkdown(council, kit).includes(council.run_id),
    };
    return checks;
  };
}
document.getElementById("btn-saas").onclick = () => { pack = "saas"; render(); document.getElementById("status").textContent = "Pack: saas"; };
document.getElementById("btn-cafe").onclick = () => { pack = "cafe"; render(); document.getElementById("status").textContent = "Pack: cafe"; };
document.getElementById("btn-copy-md").onclick = async () => {
  const ok = await copyText(window.__councilMarkdown());
  document.getElementById("status").textContent = ok ? "Markdown copied." : "Copy failed.";
};
document.getElementById("btn-download").onclick = () => {
  const md = window.__councilMarkdown();
  const a = document.createElement("a");
  a.href = "data:text/markdown;charset=utf-8," + encodeURIComponent(md);
  a.download = DATA[pack].council.run_id + "-council.md";
  a.click();
  document.getElementById("status").textContent = "Download started.";
};
render();
</script>
</body>
</html>
